name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, hermetic, no network beyond npm. Proves the engine loads and behaves on a machine
  # that has none of the third-party tools — which is what a fresh user actually has.
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # The fast job skips its gate tests when the dependency skills are absent. This job installs
  # them, so the gate is exercised against the real upstream tools rather than a stand-in.
  integration:
    name: full suite with the gate tools installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed by cloning rather than through the skills CLI, because the CLI's target
      # depends on detecting an installed agent — and a CI runner has none, so it can exit 0
      # having placed nothing. This mirrors what `--copy` does, without the detection.
      - name: Install the dependency skills
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents/skills"
          clone() { git clone --depth 1 "https://github.com/$1" "$HOME/.agents/skills/$2"; }
          clone conorbronsdon/avoid-ai-writing    avoid-ai-writing
          clone guillaumemeyer/watermarks-remover remove-ai-marks
          clone adelpro/fasaha                    fasaha
          clone adelpro/purple-cow-content        purple-cow-content
          echo "--- what landed ---"
          ls -1 "$HOME/.agents/skills"
          test -f "$HOME/.agents/skills/avoid-ai-writing/scripts/check-style.js"
          test -f "$HOME/.agents/skills/remove-ai-marks/scripts/inspect_text.py"

      - name: Run the whole suite
        run: node --test

      # The point of this job is the gate. If the tools failed to resolve, the gate tests skip
      # and the run above still passes green — so assert that they did not.
      - name: The gate tests must not silently skip
        run: |
          node --test tests/gate.test.mjs tests/mcp.test.mjs > gate.log 2>&1
          cat gate.log
          grep -q "# skipped 0" gate.log || {
            echo "::error::the gate tests skipped — the third-party tools did not resolve"
            exit 1
          }
