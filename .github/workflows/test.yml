name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, hermetic, no network beyond npm. Proves the engine loads and behaves on a machine
  # that has none of the third-party tools — which is what a fresh user actually has.
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # The fast job skips its gate tests when the dependency skills are absent. This job installs
  # them, so the gate is exercised against the real upstream tools rather than a stand-in.
  integration:
    name: full suite with the gate tools installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installs through the package's own installer, so CI exercises the path a user actually
      # takes rather than a parallel reimplementation of it.
      - name: Install with the package's own installer
        run: node bin/install.mjs --apply

      - name: The gate entry points must exist
        run: |
          set -euo pipefail
          test -f "$HOME/.agents/skills/avoid-ai-writing/scripts/check-style.js"
          test -f "$HOME/.agents/skills/remove-ai-marks/scripts/inspect_text.py"
          ls -1 "$HOME/.agents/skills"
          node skills/writing-flow/scripts/doctor.mjs

      - name: Run the whole suite
        run: node --test

      # The point of this job is the gate. If the tools failed to resolve, the gate tests skip
      # and the run above still passes green — so assert that they did not.
      - name: The gate tests must not silently skip
        run: |
          node --test tests/gate.test.mjs tests/mcp.test.mjs > gate.log 2>&1
          cat gate.log
          grep -q "# skipped 0" gate.log || {
            echo "::error::the gate tests skipped — the third-party tools did not resolve"
            exit 1
          }

  # No runner has ~/.hermes or a hermes binary, so the Hermes branch is invisible to the jobs
  # above. Exercise it against a fake home and a stub CLI rather than shipping it untested.
  hermes-surface:
    name: the hermes surfaces are planned and written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stub the hermes CLI and the root it is detected by
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.hermes"
          cat > "$HOME/.local/bin/hermes" <<'STUB'
          #!/bin/sh
          echo "hermes $@" >> "$HOME/hermes-calls.log"
          # The real CLI writes config.yaml as it registers. A stub that only logs would make a
          # second apply look like a fresh registration, and the idempotence check would prove
          # nothing.
          case "$1 $2" in
            'mcp add')
              mkdir -p "$HOME/.hermes"
              printf 'mcp_servers:\n  writing-flow:\n    command: node\n' > "$HOME/.hermes/config.yaml"
              ;;
            'mcp remove')
              rm -f "$HOME/.hermes/config.yaml"
              ;;
          esac
          exit 0
          STUB
          chmod +x "$HOME/.local/bin/hermes"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply
        run: node bin/install.mjs --apply --no-deps --no-python-check

      - name: The hermes surfaces must exist
        run: |
          set -euo pipefail
          test -f "$HOME/.hermes/skill-bundles/flow-writing.yaml"
          test -f "$HOME/.hermes/skill-bundles/flow-doctor.yaml"
          test -f "$HOME/.hermes/skills/writing-flow/scripts/paths.json"
          grep -q 'mcp add writing-flow --command node --args .*mcp-server.mjs' "$HOME/hermes-calls.log"

      - name: A second apply must not re-register the server
        run: |
          set -euo pipefail
          before=$(grep -c 'mcp add' "$HOME/hermes-calls.log" || true)
          node bin/install.mjs --apply --no-deps --no-python-check > second.log 2>&1
          cat second.log
          after=$(grep -c 'mcp add' "$HOME/hermes-calls.log" || true)
          test "$before" = "$after" || { echo "::error::the MCP server was registered twice"; exit 1; }
          grep -q "unchanged writing-flow in" second.log || { echo "::error::the second apply did not report the server as unchanged"; exit 1; }

